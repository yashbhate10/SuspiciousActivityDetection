version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: suspicious_backend
    ports:
      - "8000:8000"
    volumes:
      - ./evidence:/app/evidence
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # React Surveillance Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suspicious_dashboard
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Optional Local MongoDB Database (if not using MongoDB Atlas)
  mongodb:
    image: mongo:7.0
    container_name: suspicious_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
